name: Bug report
description: Report a reproducible Infra9CORE generator or template defect.
title: "bug: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Infra9CORE version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 24.x
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command and selected recipes
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
